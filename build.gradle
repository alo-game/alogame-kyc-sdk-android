plugins {
    id 'java-base'
    id 'maven-publish'
}

group = 'vn.alogame'
version = '1.0.1'

repositories {
    google()
    mavenCentral()
}

publishing {
    publications {
        maven(MavenPublication) {
            artifact file('kyc-sdk.aar')

            groupId    = 'vn.alogame'
            artifactId = 'kyc-sdk'
            version    = '1.0.1'
        }
    }
}
